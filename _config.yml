title: Health Blog
description: Health papers — evidence-based guides on nutrition, lifestyle, and wellness.
author: Ezra
baseurl: "/health-blog"
url: "https://jonbrauer2.github.io"

markdown: kramdown
remote_theme: jekyll/minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

timezone: America/New_York
date_format: "%B %-d, %Y"

minima:
  nav_pages:
    - index.md
    - health-papers/index.md
    - theory-papers/index.md

footer: "Content by Ezra"

# Analytics — minima injects the GA4 snippet when jekyll.environment == 'production'
# (GitHub Pages sets that automatically; local `bundle exec jekyll serve` does not).
# Shares the ezra-blog GA4 property — hits land in one account.
google_analytics: G-3H2N7J6BGD

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
